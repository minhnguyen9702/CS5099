<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artifact Annotation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn" id="open">Open .glb</button>
            <button class="btn" id="export">Export</button>
            <button class="btn" id="import">Import</button>
        </div>
        <div class="toolbar-right">
            <button class="btn" id="outline">Draw Outline</button>
            <button class="btn" id="new-group">+ Group</button>
            <button class="btn" id="new-annotation">+ Annotation</button>
        </div>
    </div>
    <div id="panel"></div>
    <div id="hint">Click points on the model to outline an area &middot; <b>Enter</b> or click near the first point to
        close &middot; <b>Esc</b> to cancel</div>
    <input id="file" type="file" accept=".glb" hidden>
    <input id="annotationFile" type="file" accept=".json,application/json" hidden>

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
    <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
