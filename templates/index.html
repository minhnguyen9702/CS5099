<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>glb viewer</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .open {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1;
            font: 14px ui-sans-serif, system-ui, sans-serif;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #3a3a3a;
            background: #262626;
            color: #eee;
        }

        .open:hover {
            border-color: #777;
        }
    </style>
</head>

<body>
    <button class="open" id="open">Open .glb</button>
    <input id="file" type="file" accept=".glb" hidden>

    <!-- The importmap must live in the HTML document; the module below resolves
     its bare "three" / "three/addons/" imports against it. -->
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
    <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>

</html>
